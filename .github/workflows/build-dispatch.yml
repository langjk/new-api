name: Build dispatch image (ghcr)

# 自定义：带「中转状态」列的 new-api 镜像，推到 ghcr.io/langjk/new-api:dispatch
on:
  push:
    branches: [dispatch-column]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Write VERSION
        run: echo "dispatch-$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/langjk/new-api:dispatch
          cache-from: type=gha
          cache-to: type=gha,mode=max
